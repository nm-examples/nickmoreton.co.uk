name: checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webapp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/webapp
      DJANGO_SETTINGS_MODULE: webapp.settings.dev

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Keep Docker and .pre-commit-config.yaml aligned.
          version: "0.13.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Validate the accepted lockfile
        run: uv lock --check

      - name: Install PostgreSQL build headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpq-dev

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Set up Node for static assets
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Prepare static assets
        run: |
          npm ci
          npm run build
          uv run --locked python manage.py collectstatic --noinput

      - name: Check code style
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .

      - name: Check Django configuration and migrations
        run: |
          uv run --locked python -Wa manage.py check
          uv run --locked python manage.py makemigrations --check --dry-run

      - name: Run PostgreSQL regression tests
        run: uv run --locked python -Wa manage.py test --noinput
