<div data-filter-controls hidden>
    <label class="search" for="{{ filter_id }}"><span aria-hidden="true">⌕</span><input id="{{ filter_id }}" type="search" placeholder="{{ placeholder }}" aria-label="{{ filter_label }}" data-filter-input></label>
    <button class="filter-reset" type="button" data-filter-reset hidden>Clear search</button>
    <span class="search-results" role="status" aria-live="polite" data-filter-status></span>
</div>
