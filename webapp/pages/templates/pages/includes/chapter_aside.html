{% load wagtailcore_tags %}
{% if chapters %}<section class="chapter-list"><p class="sidebar-label">ARTICLE CHAPTERS</p><div class="toc">{% if current_chapter %}<a href="{% pageurl article %}">Back to article</a>{% endif %}{% for chapter in chapters %}<a href="{% pageurl chapter %}"{% if chapter.id == current_chapter.id %} aria-current="page"{% endif %}>{{ chapter.title }}</a>{% endfor %}</div></section>{% endif %}
