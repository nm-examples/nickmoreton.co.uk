[project]
name = "nickmoreton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "dj-database-url>=3.1.2,<4",
    "django>=6.0.9,<6.1",
    "django-browser-reload>=1.21.0,<2",
    "django-storages[s3]>=1.14.6,<2",
    "gunicorn>=26.2.0,<27",
    "psycopg2>=2.9.13,<3",
    "pyyaml>=6.0.3,<7",
    "requests>=2.34.2,<3",
    "wagtail>=7.4.4,<7.5",
    "wagtail-unveil==0.1.0a7",
    "whitenoise>=6.12.0,<7",
]

[dependency-groups]
dev = [
    "django-upgrade>=1.33.0,<2",
    "pre-commit>=4.7.0,<5",
    "pyupgrade>=3.22.0,<4",
    "ruff>=0.17.1,<0.18",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
exclude-newer = "2026-10-20T21:09:06Z"
prerelease = "explicit"
resolution = "highest"
